<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#0A0A0B" />

    <!-- SEO -->
    <title>Sourabh Nagarkar | Full-Stack Developer Portfolio</title>

    <meta
      name="description"
      content="Sourabh Nagarkar — MCA student and full-stack developer. Explore my projects, skills, certifications, achievements, resume and contact information."
    />

    <meta name="author" content="Sourabh Nagarkar" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://sourabhnagarkar.vercel.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/Portfolilo_Logo.png"
    />

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Sourabh Nagarkar | Full-Stack Developer Portfolio"
    />

    <meta
      property="og:description"
      content="Portfolio of Sourabh Nagarkar — MCA student and full-stack developer. Explore projects, skills, certifications, achievements and more."
    />

    <meta
      property="og:url"
      content="https://sourabhnagarkar.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://sourabhnagarkar.vercel.app/og-image.png"
    />

    <meta property="og:site_name" content="Sourabh Nagarkar Portfolio" />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Sourabh Nagarkar | Full-Stack Developer Portfolio"
    />

    <meta
      name="twitter:description"
      content="Portfolio of Sourabh Nagarkar — MCA student and full-stack developer."
    />

    <meta
      name="twitter:image"
      content="https://sourabhnagarkar.vercel.app/og-image.png"
    />

    <!-- Person Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sourabh Nagarkar",
        "url": "https://sourabhnagarkar.vercel.app/",
        "jobTitle": "Full-Stack Developer"
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-noir-ink">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
